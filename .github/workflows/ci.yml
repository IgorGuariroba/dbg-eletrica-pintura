name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-unit:
    name: Lint + typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble
    env:
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ci-google-id
      AUTH_GOOGLE_SECRET: ci-google-secret
      ADMIN_EMAIL: admin@dbg.test
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    env:
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_GOOGLE_ID: ci
      AUTH_GOOGLE_SECRET: ci
      ADMIN_EMAIL: admin@dbg.test
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
