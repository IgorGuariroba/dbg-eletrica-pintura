name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-unit:
    name: Lint + typecheck + unit
    runs-on: ubuntu-latest
    # Banco real para os testes de integração (drizzle repos) rodarem no CI.
    # Sem ele os 43 arquivos com `describe.skipIf(!hasDb)` skipam, zeram a
    # cobertura dos *-drizzle.ts e o coverage gate fica impossível de bater.
    #
    # O app usa o driver Neon serverless (HTTP/WS), que NÃO fala o wire-protocol
    # do Postgres comum. Por isso, além do postgres, sobe-se o proxy
    # `local-neon-http-proxy`: ele traduz HTTP/WS do driver Neon -> Postgres.
    # `NEON_LOCAL_PROXY` aponta o driver ao proxy (ver src/db/neon-local-proxy.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        # Porta exposta ao runner: migrations rodam via TCP direto (driver pg,
        # ver scripts/ci-migrate.mjs) — só o runtime dos testes passa pelo proxy.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://ci:ci@postgres:5432/ci
        ports:
          - 4444:4444
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
      NEON_LOCAL_PROXY: localhost:4444
      # Banco por arquivo de teste de integração: destrava a suíte em paralelo
      # sem nenhum compartilhamento de banco (tests/setup/worker-db.ts).
      CI_DB_PER_FILE: "1"
      # Segredo do webhook Mercado Pago: bate com o fallback do teste
      # (pagamento-route.test.ts) para a validação HMAC fechar.
      MP_WEBHOOK_SECRET: test_webhook_secret_dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Aplica o schema (migrations commitadas) antes da suíte de integração,
      # via TCP direto na porta exposta do service postgres, e cria os bancos
      # por arquivo de teste (CI_DB_PER_FILE; ver scripts/ci-migrate.mjs).
      - run: pnpm db:migrate:ci

      # unit roda com paralelismo total; integração paraleliza por worker com
      # banco próprio (ver projects no vitest.config.ts).
      - run: pnpm test:coverage:ci

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Sem `needs`: roda em paralelo ao job principal — wall time do CI vira o
    # máximo dos jobs em vez da soma.
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble
    env:
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ci-google-id
      AUTH_GOOGLE_SECRET: ci-google-secret
      ADMIN_EMAIL: admin@dbg.test
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    # Sem `needs`: roda em paralelo ao job principal.
    env:
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_GOOGLE_ID: ci
      AUTH_GOOGLE_SECRET: ci
      ADMIN_EMAIL: admin@dbg.test
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
