name: Dependabot auto-merge

# Habilita auto-merge nos PRs abertos pelo Dependabot.
# O GitHub aguarda TODOS os checks (CI: lint/typecheck/unit, e2e, build) ficarem
# verdes e só então faz o merge automaticamente. Se algum check falhar, o PR
# fica aberto aguardando intervenção manual.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Habilitar auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
