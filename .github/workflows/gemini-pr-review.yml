name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: gemini-review
    runs-on: ubuntu-latest
    # Pula bumps do Dependabot: são gated apenas pelo CI (lint/typecheck/test/build),
    # não pela review de IA. Sem isso, o gate Gemini reprovaria todo bump e travaria
    # o auto-merge de .github/workflows/dependabot-automerge.yml para sempre.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > "$RUNNER_TEMP/pr_diff.txt"

      - name: Gemini Review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Trunca diff p/ evitar estourar token limit do Gemini (8192 out + contexto)
          # e ARG_MAX do shell. ~500KB ~= 125k tokens, suficiente p/ contexto típico.
          MAX_BYTES=500000
          if [ "$(wc -c < "$RUNNER_TEMP/pr_diff.txt")" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" "$RUNNER_TEMP/pr_diff.txt" > "$RUNNER_TEMP/pr_diff_truncated.txt"
            printf '\n\n[...diff truncado em %s bytes...]\n' "$MAX_BYTES" >> "$RUNNER_TEMP/pr_diff_truncated.txt"
            mv "$RUNNER_TEMP/pr_diff_truncated.txt" "$RUNNER_TEMP/pr_diff.txt"
          fi

          # jq lê arquivos com --rawfile (evita ARG_MAX no input)
          # curl lê payload do arquivo com -d @ (evita ARG_MAX no upload)
          jq -n \
            --rawfile prompt .github/prompts/pr-review.md \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --rawfile diff "$RUNNER_TEMP/pr_diff.txt" \
            '{
              contents: [{
                parts: [{
                  text: ($prompt + "\n\n---\n\n## PR: " + $title + "\n\n" + $body + "\n\n## Diff:\n```\n" + $diff + "\n```")
                }]
              }],
              generationConfig: {
                temperature: 0.3,
                maxOutputTokens: 2048
              }
            }' > "$RUNNER_TEMP/payload.json"

          # Retry até 4x em erros transitórios (503 UNAVAILABLE, 429 RATE_LIMIT)
          MAX_ATTEMPTS=4
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d @"$RUNNER_TEMP/payload.json" > "$RUNNER_TEMP/response.json"

            ERROR_CODE=$(jq -r '.error.code // empty' "$RUNNER_TEMP/response.json")
            if [ "$ERROR_CODE" != "503" ] && [ "$ERROR_CODE" != "429" ]; then
              break
            fi

            echo "::warning::Gemini API retornou $ERROR_CODE (tentativa $attempt/$MAX_ATTEMPTS), aguardando..."
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done

          REVIEW=$(jq -r '.candidates[0].content.parts[0].text // "Erro ao gerar review"' "$RUNNER_TEMP/response.json")

          if [ "$REVIEW" = "Erro ao gerar review" ]; then
            ERROR_CODE=$(jq -r '.error.code // "unknown"' "$RUNNER_TEMP/response.json")
            echo "::warning::Gemini API indisponível (code=$ERROR_CODE) após $MAX_ATTEMPTS tentativas — pulando review"
            jq . "$RUNNER_TEMP/response.json"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$REVIEW" > "$RUNNER_TEMP/review.txt"

          if echo "$REVIEW" | grep -q "MUDANÇAS NECESSÁRIAS"; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
          else
            echo "approved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment
        if: steps.review.outputs.skipped != 'true'
        uses: actions/github-script@v7
        env:
          REVIEW_APPROVED: ${{ steps.review.outputs.approved }}
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync(process.env.RUNNER_TEMP + '/review.txt', 'utf8');
            const approved = process.env.REVIEW_APPROVED === 'true';

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: `## 🤖 Gemini Code Review\n\n${review}`,
              event: approved ? 'COMMENT' : 'REQUEST_CHANGES'
            });

      - name: Gate check
        if: steps.review.outputs.approved == 'false'
        run: |
          echo "❌ Gemini solicitou mudanças. PR não aprovada."
          exit 1
